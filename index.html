<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oran Analiz Platformu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    body { background-color: #f8fafc; font-size: 13px; }
    .nav-tabs .nav-link.active { font-weight: bold; background-color: #0f172a; color: #fff !important; }
    .nav-tabs .nav-link { color: #0f172a; }
    .badge-iy { background-color: #3b82f6; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
    .badge-ms { background-color: #10b981; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
  </style>
</head>
<body class="p-2 p-md-3">

  <div class="container-fluid bg-white p-3 rounded shadow-sm">
    <ul class="nav nav-tabs mb-3" id="analizTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="ms-tab" data-bs-toggle="tab" data-bs-target="#ms-analiz" type="button">⚽ İddia (MS) Oran Analizi</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="iy-tab" data-bs-toggle="tab" data-bs-target="#iy-analiz" type="button">⏱️ İlk Yarı Oran Analizi</button>
      </li>
    </ul>

    <div class="tab-content" id="analizTabContent">
      <div class="tab-pane fade show active" id="ms-analiz">
        <div class="card mb-3 border-0 bg-light">
          <div class="card-body p-2">
            <h6 class="fw-bold mb-2">🔍 Maç Sonu Oran Filtreleme</h6>
            <div class="row g-2">
              <div class="col-4"><input type="text" id="filterMS1" class="form-control form-control-sm" placeholder="MS 1 (Örn: 1.37 veya 1,37)"></div>
              <div class="col-4"><input type="text" id="filterMSX" class="form-control form-control-sm" placeholder="MS X"></div>
              <div class="col-4"><input type="text" id="filterMS2" class="form-control form-control-sm" placeholder="MS 2"></div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table id="msOranTablosu" class="table table-striped table-hover border align-middle w-100">
            <thead class="table-dark">
              <tr>
                <th>MAÇ</th><th>MS 1</th><th>MS X</th><th>MS 2</th><th>İY SKOR</th><th>MS SKOR</th>
              </tr>
            </thead>
            <tbody id="msTabloGovde"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="iy-analiz">
        <div class="card mb-3 border-0 bg-light">
          <div class="card-body p-2">
            <h6 class="fw-bold mb-2">🔍 İlk Yarı Oran Filtreleme</h6>
            <div class="row g-2">
              <div class="col-4"><input type="text" id="filterIY1" class="form-control form-control-sm" placeholder="İY 1"></div>
              <div class="col-4"><input type="text" id="filterIYX" class="form-control form-control-sm" placeholder="İY X"></div>
              <div class="col-4"><input type="text" id="filterIY2" class="form-control form-control-sm" placeholder="İY 2"></div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table id="iyOranTablosu" class="table table-striped table-hover border align-middle w-100">
            <thead class="table-dark">
              <tr>
                <th>MAÇ</th><th>İY 1</th><th>İY X</th><th>İY 2</th><th>İY SKOR</th>
              </tr>
            </thead>
            <tbody id="iyTabloGovde"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const msSheetsCSV_URL = "https://docs.google.com/spreadsheets/d/1dtwbQFgdblHy84EFhnNT-N0lhce-jSX_IVCfQSaF_EI/gviz/tq?tqx=out:csv";
    const iySheetsCSV_URL = "https://docs.google.com/spreadsheets/d/14yjMc1-ANEtwiG9kkDbmiYSdM9Aa4x6Bl6w1QTJHXT0/gviz/tq?tqx=out:csv";

    $(document).ready(function() {
      // 1. İddia MS Tablosu
      Papa.parse(msSheetsCSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let html = '';
          let data = results.data;
          // Satırları gez (0. satır başlık olduğu için 1'den başlıyoruz)
          for(let i = 1; i < data.length; i++) {
            let row = data[i];
            // Sütun sıralaması: B=1, C=2, D=3, E=4, G=6, H=7
            if(row && row[1]) {
              html += `<tr>
                <td class="fw-bold">${row[1] || '-'}</td>
                <td>${row[2] || '-'}</td>
                <td>${row[3] || '-'}</td>
                <td>${row[4] || '-'}</td>
                <td><span class="badge-iy">${row[6] || '-'}</span></td>
                <td><span class="badge-ms">${row[7] || '-'}</span></td>
              </tr>`;
            }
          }
          $('#msTabloGovde').html(html);
          let msTable = $('#msOranTablosu').DataTable({ 
            "paging": true, "pageLength": 25, "info": false,
            "language": { "zeroRecords": "Eşleşen maç bulunamadı", "search": "Hızlı Ara:" }
          });

          // Filtreleme Dinamikleri (Hem nokta hem virgül destekli)
          function applySearch(val, colIdx, table) {
            if(!val) { table.column(colIdx).search('').draw(); return; }
            let normalized = val.replace(',', '.');
            let regex = '^(' + val.replace('.', '\\.') + '|' + normalized.replace('.', ',') + ')$';
            table.column(colIdx).search(regex, true, false).draw();
          }

          $('#filterMS1').on('keyup change', function() { applySearch(this.value, 1, msTable); });
          $('#filterMSX').on('keyup change', function() { applySearch(this.value, 2, msTable); });
          $('#filterMS2').on('keyup change', function() { applySearch(this.value, 3, msTable); });
        }
      });

      // 2. İlk Yarı Tablosu
      Papa.parse(iySheetsCSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let html = '';
          let data = results.data;
          for(let i = 1; i < data.length; i++) {
            let row = data[i];
            if(row && row[1]) {
              html += `<tr>
                <td class="fw-bold">${row[1] || '-'}</td>
                <td>${row[2] || '-'}</td>
                <td>${row[3] || '-'}</td>
                <td>${row[4] || '-'}</td>
                <td><span class="badge-iy">${row[6] || '-'}</span></td>
              </tr>`;
            }
          }
          $('#iyTabloGovde').html(html);
          let iyTable = $('#iyOranTablosu').DataTable({ 
            "paging": true, "pageLength": 25, "info": false,
            "language": { "zeroRecords": "Eşleşen maç bulunamadı", "search": "Hızlı Ara:" }
          });

          function applySearchIY(val, colIdx, table) {
            if(!val) { table.column(colIdx).search('').draw(); return; }
            let normalized = val.replace(',', '.');
            let regex = '^(' + val.replace('.', '\\.') + '|' + normalized.replace('.', ',') + ')$';
            table.column(colIdx).search(regex, true, false).draw();
          }

          $('#filterIY1').on('keyup change', function() { applySearchIY(this.value, 1, iyTable); });
          $('#filterIYX').on('keyup change', function() { applySearchIY(this.value, 2, iyTable); });
          $('#filterIY2').on('keyup change', function() { applySearchIY(this.value, 3, iyTable); });
        }
      });
    });
  </script>
</body>
</html>
