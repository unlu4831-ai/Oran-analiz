<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oran Analiz Portalı</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    :root {
      --primary-blue: #1e40af;
      --secondary-blue: #3b82f6;
      --bg-light: #eff6ff;
      --card-bg: #ffffff;
    }

    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #1e293b;
      font-size: 13px;
    }

    .main-card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(30, 64, 175, 0.08);
      border: 1px solid #dbeafe;
      padding: 12px;
      margin-top: 5px;
    }

    /* Mavi Sekme Tasarımı */
    .nav-tabs {
      border-bottom: 2px solid #cbd5e1;
    }
    .nav-tabs .nav-link {
      color: #475569;
      font-weight: 600;
      border: none;
      padding: 8px 14px;
      border-radius: 6px 6px 0 0;
    }
    .nav-tabs .nav-link.active {
      background-color: var(--primary-blue);
      color: #ffffff !important;
    }

    /* Filtre Alanı */
    .filter-box {
      background-color: var(--bg-light);
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .filter-title {
      color: var(--primary-blue);
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 12px;
    }

    /* Tablo & Maç İsimleri */
    .table { width: 100% !important; margin-bottom: 0; }
    .table thead th {
      background-color: var(--primary-blue) !important;
      color: #ffffff !important;
      text-align: center;
      vertical-align: middle;
      font-size: 11px;
      padding: 8px 4px;
      white-space: nowrap;
    }
    .table tbody td {
      vertical-align: middle;
      text-align: center;
      padding: 6px 4px;
    }

    /* Maç İsimleri Üst Üste Binmesin & Sağa Kaymasın */
    .match-cell {
      text-align: left !important;
      font-weight: 600;
      color: #0f172a;
      white-space: normal !important;
      word-break: break-word;
      min-width: 105px;
      line-height: 1.25;
    }

    /* Rozetler */
    .badge-iy {
      background-color: #0284c7;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
    .badge-ms {
      background-color: #16a34a;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>
<body class="p-1 p-md-3">

  <div class="container-fluid max-width-lg p-0">
    <div class="main-card">
      
      <ul class="nav nav-tabs mb-2" id="analizTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="ms-tab" data-bs-toggle="tab" data-bs-target="#ms-analiz" type="button">⚽ İddia (MS) Oran Analizi</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="iy-tab" data-bs-toggle="tab" data-bs-target="#iy-analiz" type="button">⏱️ İlk Yarı Oran Analizi</button>
        </li>
      </ul>

      <div class="tab-content" id="analizTabContent">
        
        <!-- 1. İDDİA (MS) TABLOSU -->
        <div class="tab-pane fade show active" id="ms-analiz">
          <div class="filter-box">
            <div class="filter-title">🔍 Maç Sonu Oran Filtreleme</div>
            <div class="row g-2">
              <div class="col-4"><input type="text" id="ms1_in" class="form-control form-control-sm" placeholder="MS 1"></div>
              <div class="col-4"><input type="text" id="msx_in" class="form-control form-control-sm" placeholder="MS X"></div>
              <div class="col-4"><input type="text" id="ms2_in" class="form-control form-control-sm" placeholder="MS 2"></div>
            </div>
          </div>
          <div class="table-responsive">
            <table id="msTable" class="table table-striped table-hover border align-middle">
              <thead>
                <tr>
                  <th>MAÇ</th>
                  <th>MS 1</th>
                  <th>MS X</th>
                  <th>MS 2</th>
                  <th>İY SKOR</th>
                  <th>MS SKOR</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- 2. İLK YARI TABLOSU -->
        <div class="tab-pane fade" id="iy-analiz">
          <div class="filter-box">
            <div class="filter-title">🔍 İlk Yarı Oran Filtreleme</div>
            <div class="row g-2">
              <div class="col-4"><input type="text" id="iy1_in" class="form-control form-control-sm" placeholder="İY 1"></div>
              <div class="col-4"><input type="text" id="iyx_in" class="form-control form-control-sm" placeholder="İY X"></div>
              <div class="col-4"><input type="text" id="iy2_in" class="form-control form-control-sm" placeholder="İY 2"></div>
            </div>
          </div>
          <div class="table-responsive">
            <table id="iyTable" class="table table-striped table-hover border align-middle">
              <thead>
                <tr>
                  <th>MAÇ</th>
                  <th>İY 1</th>
                  <th>İY X</th>
                  <th>İY 2</th>
                  <th>İY SKOR</th>
                  <th>MS SKOR</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const MS_CSV_URL = "https://docs.google.com/spreadsheets/d/1dtwbQFgdblHy84EFhnNT-N0lhce-jSX_IVCfQSaF_EI/gviz/tq?tqx=out:csv";
    const IY_CSV_URL = "https://docs.google.com/spreadsheets/d/14yjMc1-ANEtwiG9kkDbmiYSdM9Aa4x6Bl6w1QTJHXT0/gviz/tq?tqx=out:csv";

    // Oran Temizleme ve Standartlaştırma (1.9, 1.90, 1,90 hepsini eşleştirir)
    function cleanOran(val) {
      if (!val) return "";
      let str = val.toString().trim().replace(',', '.');
      let num = parseFloat(str);
      return isNaN(num) ? str : num.toString();
    }

    // Başlık İsimlerinden Sütun İndeksi Bulma
    function getHeaderMap(headerRow) {
      let map = {};
      headerRow.forEach((col, idx) => {
        let name = col.toString().trim().toUpperCase();
        map[name] = idx;
      });
      return map;
    }

    $(document).ready(function() {
      
      // DataTables Başlat
      let dtMS = $('#msTable').DataTable({
        paging: true, pageLength: 25, info: false, ordering: false,
        language: { zeroRecords: "Eşleşen maç bulunamadı", search: "Ara:" }
      });

      let dtIY = $('#iyTable').DataTable({
        paging: true, pageLength: 25, info: false, ordering: false,
        language: { zeroRecords: "Eşleşen maç bulunamadı", search: "Ara:" }
      });

      // MS TABLOSUNU DOLDUR
      Papa.parse(MS_CSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let data = results.data;
          if (data.length < 2) return;

          let map = getHeaderMap(data[0]);

          // Esnek Sütun Bulucu
          let idxMac = map["MAÇ"] ?? map["MAC"] ?? 1;
          let idx1   = map["MS 1"] ?? map["MS1"] ?? 2;
          let idxX   = map["MS X"] ?? map["MSX"] ?? 3;
          let idx2   = map["MS 2"] ?? map["MS2"] ?? 4;
          let idxIY  = map["İY SKORU"] ?? map["İY SKOR"] ?? map["IYSKOR"] ?? 6;
          let idxMS  = map["MS SKORU"] ?? map["MS SKOR"] ?? map["MSSKOR"] ?? 7;

          dtMS.clear();
          for (let i = 1; i < data.length; i++) {
            let r = data[i];
            if (!r || !r[idxMac]) continue;

            let mac = `<div class="match-cell">${r[idxMac]}</div>`;
            let o1 = r[idx1] || '-';
            let oX = r[idxX] || '-';
            let o2 = r[idx2] || '-';
            let iy = (r[idxIY] && r[idxIY] !== '-') ? `<span class="badge-iy">${r[idxIY]}</span>` : '-';
            let ms = (r[idxMS] && r[idxMS] !== '-') ? `<span class="badge-ms">${r[idxMS]}</span>` : '-';

            dtMS.row.add([mac, o1, oX, o2, iy, ms]);
          }
          dtMS.draw();
        }
      });

      // İY TABLOSUNU DOLDUR
      Papa.parse(IY_CSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let data = results.data;
          if (data.length < 2) return;

          let map = getHeaderMap(data[0]);

          let idxMac = map["MAÇ"] ?? map["MAC"] ?? 1;
          let idx1   = map["İY 1"] ?? map["İY1"] ?? map["MS 1"] ?? 2;
          let idxX   = map["İY X"] ?? map["İYX"] ?? map["MS X"] ?? 3;
          let idx2   = map["İY 2"] ?? map["İY2"] ?? map["MS 2"] ?? 4;
          let idxIY  = map["İY SKORU"] ?? map["İY SKOR"] ?? map["IYSKOR"] ?? 6;
          let idxMS  = map["MS SKORU"] ?? map["MS SKOR"] ?? map["MSSKOR"] ?? 7;

          dtIY.clear();
          for (let i = 1; i < data.length; i++) {
            let r = data[i];
            if (!r || !r[idxMac]) continue;

            let mac = `<div class="match-cell">${r[idxMac]}</div>`;
            let o1 = r[idx1] || '-';
            let oX = r[idxX] || '-';
            let o2 = r[idx2] || '-';
            let iy = (r[idxIY] && r[idxIY] !== '-') ? `<span class="badge-iy">${r[idxIY]}</span>` : '-';
            let ms = (r[idxMS] && r[idxMS] !== '-') ? `<span class="badge-ms">${r[idxMS]}</span>` : '-';

            dtIY.row.add([mac, o1, oX, o2, iy, ms]);
          }
          dtIY.draw();
        }
      });

      // AKILLI FİLTRELEME FONKSİYONU
      function applyFilter(inputElem, colIdx, table) {
        let val = cleanOran($(inputElem).val());
        if (!val) {
          table.column(colIdx).search('').draw();
          return;
        }

        // 1.90, 1.9, 1,90 hepsini kapsayan regex arama
        $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
          if (settings.nTable !== table.table().node()) return true;
          let cellVal = cleanOran(data[colIdx]);
          return cellVal.startsWith(val);
        });

        table.draw();
        $.fn.dataTable.ext.search.pop();
      }

      // MS Filtre Tetikleyicileri
      $('#ms1_in').on('keyup change', function() { applyFilter(this, 1, dtMS); });
      $('#msx_in').on('keyup change', function() { applyFilter(this, 2, dtMS); });
      $('#ms2_in').on('keyup change', function() { applyFilter(this, 3, dtMS); });

      // İY Filtre Tetikleyicileri
      $('#iy1_in').on('keyup change', function() { applyFilter(this, 1, dtIY); });
      $('#iyx_in').on('keyup change', function() { applyFilter(this, 2, dtIY); });
      $('#iy2_in').on('keyup change', function() { applyFilter(this, 3, dtIY); });

    });
  </script>
</body>
</html>
