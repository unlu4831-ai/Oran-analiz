<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oran Analiz Portalı</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    :root {
      --primary-blue: #0d6efd;
      --light-blue: #e7f1ff;
      --border-blue: #b6d4fe;
    }

    body {
      background-color: #f4f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333;
      font-size: 13px;
    }

    .main-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(13, 110, 253, 0.08);
      border: 1px solid var(--border-blue);
      padding: 12px;
      margin-top: 5px;
    }

    .nav-tabs {
      border-bottom: 2px solid var(--border-blue);
    }
    .nav-tabs .nav-link {
      color: #495057;
      font-weight: 600;
      border: none;
      padding: 8px 14px;
      border-bottom: 3px solid transparent;
    }
    .nav-tabs .nav-link.active {
      color: var(--primary-blue);
      background-color: transparent;
      border-bottom: 3px solid var(--primary-blue);
    }

    .table { width: 100% !important; margin-bottom: 0; }
    .table thead th {
      background-color: var(--primary-blue) !important;
      color: #ffffff !important;
      text-align: center;
      vertical-align: middle;
      font-size: 12px;
      padding: 8px 4px;
      white-space: nowrap;
    }
    .table tbody td {
      vertical-align: middle;
      text-align: center;
      padding: 6px 4px;
    }

    .match-cell {
      text-align: left !important;
      font-weight: 600;
      color: #1a252f;
      white-space: normal !important;
      word-break: break-word;
      line-height: 1.3;
    }

    .badge-iy {
      background-color: #0dcaf0;
      color: #000;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
    .badge-ms {
      background-color: #198754;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
    }
  </style>
</head>
<body class="p-1 p-md-3">

  <div class="container-fluid max-width-lg p-0">
    <div class="main-card">
      
      <ul class="nav nav-tabs mb-3" id="analizTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="ms-tab" data-bs-toggle="tab" data-bs-target="#ms-analiz" type="button">⚽ İddia (MS) Oran Analizi</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="iy-tab" data-bs-toggle="tab" data-bs-target="#iy-analiz" type="button">⏱️ İlk Yarı Oran Analizi</button>
        </li>
      </ul>

      <div class="tab-content" id="analizTabContent">
        
        <!-- İDDİA (MS) TABLOSU -->
        <div class="tab-pane fade show active" id="ms-analiz">
          <div class="table-responsive">
            <table id="msTable" class="table table-striped table-hover border align-middle">
              <thead>
                <tr>
                  <th style="width: 50%;">MAÇ</th>
                  <th style="width: 25%;">İLK YARI SKOR</th>
                  <th style="width: 25%;">MAÇ SONU SKOR</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- İLK YARI TABLOSU -->
        <div class="tab-pane fade" id="iy-analiz">
          <div class="table-responsive">
            <table id="iyTable" class="table table-striped table-hover border align-middle">
              <thead>
                <tr>
                  <th style="width: 70%;">MAÇ</th>
                  <th style="width: 30%;">İLK YARI SKOR</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // CSV Bağlantıları (Google Sheets Yayın URL'lerin)
    const MS_CSV_URL = "https://docs.google.com/spreadsheets/d/1dtwbQFgdblHy84EFhnNT-N0lhce-jSX_IVCfQSaF_EI/gviz/tq?tqx=out:csv";
    const IY_CSV_URL = "https://docs.google.com/spreadsheets/d/14yjMc1-ANEtwiG9kkDbmiYSdM9Aa4x6Bl6w1QTJHXT0/gviz/tq?tqx=out:csv";

    $(document).ready(function() {
      
      let dtMS = $('#msTable').DataTable({
        paging: true, pageLength: 25, info: false, ordering: false,
        language: { zeroRecords: "Orana uygun maç bulunamadı", search: "Sonuçlarda Ara:" }
      });

      let dtIY = $('#iyTable').DataTable({
        paging: true, pageLength: 25, info: false, ordering: false,
        language: { zeroRecords: "Orana uygun maç bulunamadı", search: "Sonuçlarda Ara:" }
      });

      // MS TABLOSUNU OKUMA: M=12, N=13, O=14 (0 tabanlı indeks)
      Papa.parse(MS_CSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let data = results.data;
          dtMS.clear();
          for (let i = 1; i < data.length; i++) {
            let r = data[i];
            // M Sütununda (r[12]) Maç ismi varsa ekle
            if (r && r[12] && r[12].trim() !== "" && r[12] !== "FILTRE" && r[12] !== "FİLTRE") {
              let mac = `<div class="match-cell">${r[12]}</div>`;
              let iySkor = (r[13] && r[13].trim() !== "") ? `<span class="badge-iy">${r[13]}</span>` : '-';
              let msSkor = (r[14] && r[14].trim() !== "") ? `<span class="badge-ms">${r[14]}</span>` : '-';

              dtMS.row.add([mac, iySkor, msSkor]);
            }
          }
          dtMS.draw();
        }
      });

      // İY TABLOSUNU OKUMA: J=9, K=10 (0 tabanlı indeks)
      Papa.parse(IY_CSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let data = results.data;
          dtIY.clear();
          for (let i = 1; i < data.length; i++) {
            let r = data[i];
            // J Sütununda (r[9]) Maç ismi varsa ekle
            if (r && r[9] && r[9].trim() !== "" && r[9] !== "FILTRE" && r[9] !== "FİLTRE") {
              let mac = `<div class="match-cell">${r[9]}</div>`;
              let iySkor = (r[10] && r[10].trim() !== "") ? `<span class="badge-iy">${r[10]}</span>` : '-';

              dtIY.row.add([mac, iySkor]);
            }
          }
          dtIY.draw();
        }
      });

    });
  </script>
</body>
</html>
