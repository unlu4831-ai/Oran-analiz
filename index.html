<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oran Analiz Portalı</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    :root {
      --primary-blue: #0d6efd;
      --light-blue: #e7f1ff;
      --border-blue: #b6d4fe;
    }

    body {
      background-color: #f4f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }

    .main-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(13, 110, 253, 0.08);
      border: 1px solid var(--border-blue);
      padding: 12px;
      margin-top: 5px;
    }

    .nav-tabs .nav-link {
      color: #495057;
      font-weight: 600;
      border: none;
      padding: 8px 14px;
      border-bottom: 3px solid transparent;
    }
    .nav-tabs .nav-link.active {
      color: var(--primary-blue);
      background-color: transparent;
      border-bottom: 3px solid var(--primary-blue);
    }

    .filter-box {
      background: var(--light-blue);
      border: 1px solid var(--border-blue);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .table { width: 100% !important; margin-bottom: 0; }
    .table thead th {
      background-color: var(--primary-blue) !important;
      color: #ffffff !important;
      text-align: center;
      vertical-align: middle;
      font-size: 12px;
      padding: 8px 4px;
    }
    .table tbody td {
      vertical-align: middle;
      text-align: center;
      padding: 6px 4px;
    }

    .match-cell {
      text-align: left !important;
      font-weight: 600;
      color: #1a252f;
      white-space: normal !important;
      word-break: break-word;
      line-height: 1.3;
    }

    .badge-iy {
      background-color: #0dcaf0;
      color: #000;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .badge-ms {
      background-color: #198754;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
  </style>
</head>
<body class="p-1 p-md-3">

  <div class="container-fluid max-width-lg p-0">
    <div class="main-card">
      
      <ul class="nav nav-tabs mb-3" id="analizTab" role="tablist">
        <li class="nav-item">
          <button class="nav-link active" id="ms-tab" data-bs-toggle="tab" data-bs-target="#ms-analiz" type="button">⚽ İddia (MS) Oran Analizi</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="iy-tab" data-bs-toggle="tab" data-bs-target="#iy-analiz" type="button">⏱️ İlk Yarı Oran Analizi</button>
        </li>
      </ul>

      <div class="tab-content" id="analizTabContent">
        
        <!-- İDDİA (MS) TABLOSU VE FİLTRELERİ -->
        <div class="tab-pane fade show active" id="ms-analiz">
          <div class="filter-box">
            <div class="row g-2">
              <div class="col-4"><input type="text" id="ms1_filter" class="form-control form-control-sm text-center" placeholder="MS 1"></div>
              <div class="col-4"><input type="text" id="msx_filter" class="form-control form-control-sm text-center" placeholder="MS X"></div>
              <div class="col-4"><input type="text" id="ms2_filter" class="form-control form-control-sm text-center" placeholder="MS 2"></div>
            </div>
          </div>
          <div class="table-responsive">
            <table id="msTable" class="table table-striped table-hover border align-middle">
              <thead>
                <tr>
                  <th style="width: 40%;">MAÇ</th>
                  <th>MS 1</th>
                  <th>MS X</th>
                  <th>MS 2</th>
                  <th>İYK</th>
                  <th>MSK</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- İLK YARI TABLOSU VE FİLTRELERİ -->
        <div class="tab-pane fade" id="iy-analiz">
          <div class="filter-box">
            <div class="row g-2">
              <div class="col-4"><input type="text" id="iy1_filter" class="form-control form-control-sm text-center" placeholder="İY 1"></div>
              <div class="col-4"><input type="text" id="iyx_filter" class="form-control form-control-sm text-center" placeholder="İY X"></div>
              <div class="col-4"><input type="text" id="iy2_filter" class="form-control form-control-sm text-center" placeholder="İY 2"></div>
            </div>
          </div>
          <div class="table-responsive">
            <table id="iyTable" class="table table-striped table-hover border align-middle">
              <thead>
                <tr>
                  <th style="width: 40%;">MAÇ</th>
                  <th>İY 1</th>
                  <th>İY X</th>
                  <th>İY 2</th>
                  <th>İYK</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const MS_CSV_URL = "https://docs.google.com/spreadsheets/d/1dtwbQFgdblHy84EFhnNT-N0lhce-jSX_IVCfQSaF_EI/gviz/tq?tqx=out:csv";
    const IY_CSV_URL = "https://docs.google.com/spreadsheets/d/14yjMc1-ANEtwiG9kkDbmiYSdM9Aa4x6Bl6w1QTJHXT0/gviz/tq?tqx=out:csv";

    // Oran Formatlama (Nokta/Virgül ve Tam Eşleşme Düzeltmesi)
    function cleanRate(val) {
      if(!val) return "";
      let s = val.toString().trim().replace(',', '.');
      let n = parseFloat(s);
      if(isNaN(n)) return "";
      return n.toFixed(2); // 1.9 -> 1.90 yapar
    }

    $(document).ready(function() {
      
      // MS DataTables Tanımı
      let dtMS = $('#msTable').DataTable({
        paging: true, pageLength: 25, info: false, ordering: false,
        language: { zeroRecords: "Orana uygun maç bulunamadı", search: "Sonuçlarda Ara:" }
      });

      // İY DataTables Tanımı
      let dtIY = $('#iyTable').DataTable({
        paging: true, pageLength: 25, info: false, ordering: false,
        language: { zeroRecords: "Orana uygun maç bulunamadı", search: "Sonuçlarda Ara:" }
      });

      // İDDİA (MS) VERİ ÇEKME: B=Maç(1), C=MS1(2), D=MSX(3), E=MS2(4), G=İYSkor(6), H=MSSkor(7)
      Papa.parse(MS_CSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let data = results.data;
          dtMS.clear();
          for (let i = 1; i < data.length; i++) {
            let r = data[i];
            if (r && r[1] && r[1].trim() !== "" && r[1] !== "MAÇ") {
              let mac = `<div class="match-cell">${r[1]}</div>`;
              let ms1 = cleanRate(r[2]);
              let msx = cleanRate(r[3]);
              let ms2 = cleanRate(r[4]);
              let iySkor = (r[6] && r[6].trim() !== "") ? `<span class="badge-iy">${r[6]}</span>` : '-';
              let msSkor = (r[7] && r[7].trim() !== "") ? `<span class="badge-ms">${r[7]}</span>` : '-';

              dtMS.row.add([mac, ms1, msx, ms2, iySkor, msSkor]);
            }
          }
          dtMS.draw();
        }
      });

      // İLK YARI VERİ ÇEKME: B=Maç(1), C=İY1(2), D=İYX(3), E=İY2(4), F=İYSkor(5)
      Papa.parse(IY_CSV_URL, {
        download: true, header: false,
        complete: function(results) {
          let data = results.data;
          dtIY.clear();
          for (let i = 1; i < data.length; i++) {
            let r = data[i];
            if (r && r[1] && r[1].trim() !== "" && r[1] !== "MAÇ") {
              let mac = `<div class="match-cell">${r[1]}</div>`;
              let iy1 = cleanRate(r[2]);
              let iyx = cleanRate(r[3]);
              let iy2 = cleanRate(r[4]);
              let iySkor = (r[5] && r[5].trim() !== "") ? `<span class="badge-iy">${r[5]}</span>` : '-';

              dtIY.row.add([mac, iy1, iyx, iy2, iySkor]);
            }
          }
          dtIY.draw();
        }
      });

      // --- BİREBİR (STRICT) ORAN FİLTRELEME MANTIĞI ---

      // MS Filtreleme (Sütun 1: MS1, Sütun 2: MSX, Sütun 3: MS2)
      $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
        if (settings.nTable.id !== 'msTable') return true;

        let fMS1 = cleanRate($('#ms1_filter').val());
        let fMSX = cleanRate($('#msx_filter').val());
        let fMS2 = cleanRate($('#ms2_filter').val());

        let rowMS1 = cleanRate(data[1]);
        let rowMSX = cleanRate(data[2]);
        let rowMS2 = cleanRate(data[3]);

        if (fMS1 !== "" && rowMS1 !== fMS1) return false;
        if (fMSX !== "" && rowMSX !== fMSX) return false;
        if (fMS2 !== "" && rowMS2 !== fMS2) return false;

        return true;
      });

      // İY Filtreleme (Sütun 1: İY1, Sütun 2: İYX, Sütun 3: İY2)
      $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
        if (settings.nTable.id !== 'iyTable') return true;

        let fIY1 = cleanRate($('#iy1_filter').val());
        let fIYX = cleanRate($('#iyx_filter').val());
        let fIY2 = cleanRate($('#iy2_filter').val());

        let rowIY1 = cleanRate(data[1]);
        let rowIYX = cleanRate(data[2]);
        let rowIY2 = cleanRate(data[3]);

        if (fIY1 !== "" && rowIY1 !== fIY1) return false;
        if (fIYX !== "" && rowIYX !== fIYX) return false;
        if (fIY2 !== "" && rowIY2 !== fIY2) return false;

        return true;
      });

      // Kutulara yazıldıkça anında Birebir Süzme Yap
      $('#ms1_filter, #msx_filter, #ms2_filter').on('keyup change clear', function() {
        dtMS.draw();
      });

      $('#iy1_filter, #iyx_filter, #iy2_filter').on('keyup change clear', function() {
        dtIY.draw();
      });

    });
  </script>
</body>
</html>
