<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oran Analiz Platformu</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
  <style>
    body { background-color: #f8fafc; font-size: 13px; }
    .nav-tabs .nav-link.active { font-weight: bold; background-color: #0f172a; color: #fff !important; }
    .nav-tabs .nav-link { color: #0f172a; }
    .badge-iy { background-color: #3b82f6; }
    .badge-ms { background-color: #10b981; }
  </style>
</head>
<body class="p-2 p-md-3">

  <div class="container-fluid bg-white p-3 rounded shadow-sm">
    <ul class="nav nav-tabs mb-3" id="analizTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active" id="ms-tab" data-bs-toggle="tab" data-bs-target="#ms-analiz" type="button">⚽ İddia (MS) Oran Analizi</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" id="iy-tab" data-bs-toggle="tab" data-bs-target="#iy-analiz" type="button">⏱️ İlk Yarı Oran Analizi</button>
      </li>
    </ul>

    <div class="tab-content" id="analizTabContent">
      <!-- 1. İDDİA (MS) ORAN ANALİZİ -->
      <div class="tab-pane fade show active" id="ms-analiz">
        <div class="card mb-3 border-0 bg-light">
          <div class="card-body p-2">
            <h6 class="fw-bold mb-2">🔍 Maç Sonu Oran Filtreleme (J, K, L)</h6>
            <div class="row g-2">
              <div class="col-4"><input type="number" step="0.01" id="filterMS1" class="form-control form-control-sm" placeholder="MS 1 Oran"></div>
              <div class="col-4"><input type="number" step="0.01" id="filterMSX" class="form-control form-control-sm" placeholder="MS X Oran"></div>
              <div class="col-4"><input type="number" step="0.01" id="filterMS2" class="form-control form-control-sm" placeholder="MS 2 Oran"></div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table id="msOranTablosu" class="table table-striped table-hover border align-middle w-100">
            <thead class="table-dark">
              <tr>
                <th>MAÇ</th><th>MS 1</th><th>MS X</th><th>MS 2</th><th>İY SKOR</th><th>MS SKOR</th>
              </tr>
            </thead>
            <tbody id="msTabloGovde"></tbody>
          </table>
        </div>
      </div>

      <!-- 2. İLK YARI ORAN ANALİZİ -->
      <div class="tab-pane fade" id="iy-analiz">
        <div class="card mb-3 border-0 bg-light">
          <div class="card-body p-2">
            <h6 class="fw-bold mb-2">🔍 İlk Yarı Oran Filtreleme (G, H, I)</h6>
            <div class="row g-2">
              <div class="col-4"><input type="number" step="0.01" id="filterIY1" class="form-control form-control-sm" placeholder="İY 1 Oran"></div>
              <div class="col-4"><input type="number" step="0.01" id="filterIYX" class="form-control form-control-sm" placeholder="İY X Oran"></div>
              <div class="col-4"><input type="number" step="0.01" id="filterIY2" class="form-control form-control-sm" placeholder="İY 2 Oran"></div>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table id="iyOranTablosu" class="table table-striped table-hover border align-middle w-100">
            <thead class="table-dark">
              <tr>
                <th>MAÇ</th><th>İY 1</th><th>İY X</th><th>İY 2</th><th>İY SKOR</th>
              </tr>
            </thead>
            <tbody id="iyTabloGovde"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    const msSheetsCSV_URL = "https://docs.google.com/spreadsheets/d/1dtwbQFgdblHy84EFhnNT-N0lhce-jSX_IVCfQSaF_EI/gviz/tq?tqx=out:csv";
    const iySheetsCSV_URL = "https://docs.google.com/spreadsheets/d/14yjMc1-ANEtwiG9kkDbmiYSdM9Aa4x6Bl6w1QTJHXT0/gviz/tq?tqx=out:csv";

    $(document).ready(function() {
      // MS Tablosu
      Papa.parse(msSheetsCSV_URL, {
        download: true, header: true,
        complete: function(results) {
          let html = '';
          results.data.forEach(r => {
            if(r['MAÇ']) {
              html += `<tr>
                <td class="fw-bold">${r['MAÇ']}</td>
                <td>${r['MS 1'] || '-'}</td>
                <td>${r['MS X'] || '-'}</td>
                <td>${r['MS 2'] || '-'}</td>
                <td><span class="badge badge-iy">${r['İY SKORU'] || '-'}</span></td>
                <td><span class="badge badge-ms">${r['MS SKORU'] || '-'}</span></td>
              </tr>`;
            }
          });
          $('#msTabloGovde').html(html);
          let msTable = $('#msOranTablosu').DataTable({ "paging": true, "pageLength": 25, "info": false });
          $('#filterMS1').on('keyup change', function() { msTable.column(1).search(this.value ? '^' + this.value + '$' : '', true, false).draw(); });
          $('#filterMSX').on('keyup change', function() { msTable.column(2).search(this.value ? '^' + this.value + '$' : '', true, false).draw(); });
          $('#filterMS2').on('keyup change', function() { msTable.column(3).search(this.value ? '^' + this.value + '$' : '', true, false).draw(); });
        }
      });

      // İY Tablosu
      Papa.parse(iySheetsCSV_URL, {
        download: true, header: true,
        complete: function(results) {
          let html = '';
          results.data.forEach(r => {
            if(r['MAÇ']) {
              html += `<tr>
                <td class="fw-bold">${r['MAÇ']}</td>
                <td>${r['İY 1'] || '-'}</td>
                <td>${r['İY X'] || '-'}</td>
                <td>${r['İY 2'] || '-'}</td>
                <td><span class="badge badge-iy">${r['İLK YARI SKOR'] || '-'}</span></td>
              </tr>`;
            }
          });
          $('#iyTabloGovde').html(html);
          let iyTable = $('#iyOranTablosu').DataTable({ "paging": true, "pageLength": 25, "info": false });
          $('#filterIY1').on('keyup change', function() { iyTable.column(1).search(this.value ? '^' + this.value + '$' : '', true, false).draw(); });
          $('#filterIYX').on('keyup change', function() { iyTable.column(2).search(this.value ? '^' + this.value + '$' : '', true, false).draw(); });
          $('#filterIY2').on('keyup change', function() { iyTable.column(3).search(this.value ? '^' + this.value + '$' : '', true, false).draw(); });
        }
      });
    });
  </script>
</body>
</html>
